<!-- =======================================================
     ABAS DO CADASTRO
     Inserir depois da quickbar e antes do card "Dados do bolão".
     No card atual de cadastro, acrescente id="cadastroCard".
     ======================================================= -->

<div class="cadastro-tabs" id="scTabs">
  <button type="button" class="cadastro-tab active" id="scTabCadastro">
    <i class="fas fa-pen-to-square"></i>
    Cadastro
  </button>

  <button type="button" class="cadastro-tab" id="scTabSugestao">
    <i class="fas fa-wand-magic-sparkles"></i>
    Sugestão Coletada
    <span class="cadastro-tab-count" id="scTabCount"></span>
  </button>
</div>

<section class="sc-panel" id="scPanel">
  <div class="sc-card">

    <div class="sc-head">
      <div class="sc-head-main">
        <div class="sc-title">
          <i class="fas fa-wand-magic-sparkles"></i>
          Sugestão Coletada — <span id="scLojaNome">—</span>
        </div>

        <div class="sc-sub" id="scFreshness">
          Consultando última coleta…
        </div>
      </div>

      <div class="sc-actions">
        <button type="button" class="sc-btn-refresh" id="scAtualizar">
          <i class="fas fa-rotate"></i>
          Atualizar
        </button>

        <button type="button" class="sc-btn-primary" id="scCadastrarSelecionados" disabled>
          <i class="fas fa-link"></i>
          Cadastrar e vincular selecionados
        </button>
      </div>
    </div>

    <div class="sc-summary">
      <label class="sc-select-all">
        <input type="checkbox" class="sc-check" id="scSelecionarTodos">
        Selecionar disponíveis
      </label>

      <span id="scResumo">0 sugestões</span>
      <span id="scResumoSelecionados">0 selecionadas</span>
    </div>

    <div class="sc-table-wrap">
      <table class="sc-table">
        <thead>
          <tr>
            <th></th>
            <th>Modalidade</th>
            <th>Concurso</th>
            <th>Jogos</th>
            <th>Dezenas</th>
            <th>Valor</th>
            <th>Códigos Caixa</th>
            <th>Cotas</th>
            <th>Período</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="scBody"></tbody>
      </table>

      <div class="sc-empty" id="scEmpty" style="display:none"></div>
    </div>

  </div>
</section>
